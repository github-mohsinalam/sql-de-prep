services:
  postgres:
    image: postgres:16
    container_name: sql-prep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlprep
      POSTGRES_PASSWORD: sqlprep
      POSTGRES_DB: sqlprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdata:
